<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free STR Profit & Break-even Calculator — Hostoryx</title><meta name="description" content="Free short-term rental profit and break-even calculator."><style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#f5f8fc}.w{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#101d30;border:1px solid #294663;border-radius:18px;padding:22px;margin-top:24px}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;color:#9db1c7;font-size:13px}input{padding:11px;border-radius:9px;border:1px solid #2a4564;background:#091626;color:white}.r{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.box{background:#081522;border:1px solid #29475f;border-radius:13px;padding:15px}.box small{color:#9db1c7}.box strong{display:block;font-size:25px;margin-top:6px;color:#87eed0}a{color:#38d2af;text-decoration:none}@media(max-width:700px){.g,.r{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="top"><b>Hostoryx</b><a href="index.html">Back to Hostoryx</a></div><h1>STR Profit & Break-even Calculator</h1><p>Estimate monthly profit, break-even occupancy and target nightly rate.</p><div class="card"><div class="g"><label>Average nightly rate<input id="rate" type="number" value="150"></label><label>Occupied nights / month<input id="nights" type="number" value="18"></label><label>Platform fee %<input id="fee" type="number" value="15"></label><label>Cleaning cost / stay<input id="clean" type="number" value="60"></label><label>Average stay length<input id="stay" type="number" value="3"></label><label>Monthly fixed costs<input id="fixed" type="number" value="1600"></label><label>Variable cost / occupied night<input id="variable" type="number" value="8"></label><label>Target profit margin %<input id="margin" type="number" value="25"></label></div><div class="r"><div class="box"><small>Gross revenue</small><strong id="gross">—</strong></div><div class="box"><small>Estimated profit</small><strong id="profit">—</strong></div><div class="box"><small>Break-even nights</small><strong id="be">—</strong></div><div class="box"><small>Target nightly rate</small><strong id="target">—</strong></div></div></div></div><script>const q=id=>document.getElementById(id);['rate','nights','fee','clean','stay','fixed','variable','margin'].forEach(x=>q(x).oninput=calc);function money(v){return '$'+v.toFixed(2)}function calc(){let r=+q('rate').value||0,n=+q('nights').value||0,f=(+q('fee').value||0)/100,cl=+q('clean').value||0,st=Math.max(1,+q('stay').value||1),fx=+q('fixed').value||0,vr=+q('variable').value||0,m=(+q('margin').value||0)/100;let gross=r*n,profit=gross-gross*f-(n/st*cl)-n*vr-fx,contrib=r*(1-f)-vr-cl/st,be=contrib>0?fx/contrib:0,den=1-f-m,target=den>0?(fx/Math.max(n,1)+vr+cl/st)/den:0;q('gross').textContent=money(gross);q('profit').textContent=money(profit);q('be').textContent=be.toFixed(1);q('target').textContent=money(target)}calc()</script></body></html>
